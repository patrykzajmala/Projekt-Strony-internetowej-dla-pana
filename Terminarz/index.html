<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Terminarz</title>
    <style>
        :root { 
            --primary: #4a90e2; 
            --bg: #f5f7fa; 
            --surface: #ffffff; 
            --border: #e1e4e8; 
        }
        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            padding: 20px; 
        }
        .calendar-container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: var(--surface); 
            padding: 20px; 
            border-radius: 8px; 
        }
        .calendar-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 8px; 
        }
        .day-name { 
            text-align: center; 
            font-weight: bold; 
            padding: 5px; 
            color: #6a737d; 
        }
        .calendar-day { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            min-height: 90px; 
            padding: 5px; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .calendar-day.empty { 
            background: transparent; 
            border: none; 
            cursor: default; 
        }
        .day-number { 
            font-weight: bold; 
        }
        .event-badge { 
            font-size: 11px; 
            padding: 2px; 
            margin-top: 3px; 
            border-radius: 3px; 
            color: white; 
        }
        .event-badge.spotkanie { 
            background: #28a745; 
        }
        .event-badge.zadanie { 
            background: #f1a325; 
        }
        
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.4); 
            display: none; 
            justify-content: center; 
            align-items: center; 
        }
        .modal-overlay.active { 
            display: flex; 
        }
        .modal-box { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 400px; 
        }
        .modal-header { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
        }
        .close-btn { 
            cursor: pointer; 
            background: none; 
            border: none; 
            font-size: 20px; 
        }
        .form-group { 
            margin-bottom: 12px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 4px; 
        }
        .form-group input, .form-group select, .form-group textarea { width: 100%; 
            padding: 6px; 
            box-sizing: border-box; 
        }
        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px; 
            width: 100%; 
            cursor: pointer; 
            border-radius: 4px; 
        }
        .list-item { 
            padding: 8px; 
            margin-bottom: 5px; 
            background: #f8f9fa; 
            border-left: 4px solid #ccc; 
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="calendar-header">
        <button id="prev-month">&lt;</button>
        <h2 id="month-title"></h2>
        <button id="next-month">&gt;</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
</div>

<div class="modal-overlay" id="modal-list">
    <div class="modal-box">
        <div class="modal-header">
            <span id="list-modal-title">Zdarzenia</span>
            <button class="close-btn" onclick="closeModal('modal-list')">&times;</button>
        </div>
        <div id="events-list-container"></div>
        <button class="btn" id="go-to-creator-btn" style="margin-top: 10px;">Dodaj kolejne zdarzenie</button>
    </div>
</div>

<div class="modal-overlay" id="modal-creator">
    <div class="modal-box">
        <div class="modal-header">
            <span>Nowe zdarzenie</span>
            <button class="close-btn" onclick="closeModal('modal-creator')">&times;</button>
        </div>
        
        <form id="event-form">
            <div class="form-group">
                <label>Typ</label>
                <select id="event-type" required>
                    <option value="spotkanie">Spotkanie</option>
                    <option value="zadanie">Zadanie</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tytuł</label>
                <input type="text" id="event-title" required maxLength="255">
            </div>
            <div class="form-group">
                <label>Data i godzina</label>
                <input type="datetime-local" id="event-date" required>
            </div>
            <div class="form-group">
                <label>Opis (opcjonalnie)</label>
                <textarea id="event-desc" rows="3"></textarea>
            </div>
            <button type="submit" class="btn">Zapisz w bazie danych</button>
        </form>

    </div>
</div>

<script src="app.js"></script>
</body>
</html>
